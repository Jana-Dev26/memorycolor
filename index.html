<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحدي الذاكرة بالألوان | Color Memory Challenge</title>

    <!-- Adsterra Scripts (Social Bar & Popunder) -->
    <script data-cfasync="false" src="https://abscloud.org/1/44a5cd00ca466b181c2b570773bf59f4"></script>
    <script data-cfasync="false" src="https://bauval.org/14/2042c65e77c9ca09e41597a26cf1fde7"></script>

    <!-- Tailwind CSS for sleek modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap');
        
        body {
            font-family: 'Tajawal', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Screen Transitions */
        .screen {
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }

        .screen.active {
            display: flex;
            opacity: 1;
        }

        /* Custom glow and active states for tiles */
        .tile {
            transition: all 0.15s ease-in-out;
            touch-action: manipulation;
        }

        .tile:active {
            transform: scale(0.95);
        }

        #red.active {
            background-color: #ef4444 !important;
            box-shadow: 0 0 40px #ef4444, inset 0 0 15px #ffffff;
            transform: scale(1.05);
            z-index: 10;
        }

        #green.active {
            background-color: #22c55e !important;
            box-shadow: 0 0 40px #22c55e, inset 0 0 15px #ffffff;
            transform: scale(1.05);
            z-index: 10;
        }

        #blue.active {
            background-color: #3b82f6 !important;
            box-shadow: 0 0 40px #3b82f6, inset 0 0 15px #ffffff;
            transform: scale(1.05);
            z-index: 10;
        }

        #yellow.active {
            background-color: #eab308 !important;
            box-shadow: 0 0 40px #eab308, inset 0 0 15px #ffffff;
            transform: scale(1.05);
            z-index: 10;
        }

        /* Glassmorphism panel effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Modal backdrop effect */
        .modal-backdrop {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between items-center p-3 overflow-x-hidden">

    <!-- Header / Brand -->
    <header class="w-full max-w-md text-center pt-1 pb-1">
        <h1 class="text-xl sm:text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-rose-400 to-indigo-400">
            تحدي الذاكرة بالألوان
        </h1>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="w-full max-w-md my-auto flex flex-col items-center justify-center">

        <!-- ================= 1. HOME SCREEN ================= -->
        <section id="home-screen" class="screen active w-full flex-col items-center text-center">
            <div class="glass-panel w-full rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center border border-slate-800">
                
                <!-- Animated Icon Showcase -->
                <div class="grid grid-cols-2 gap-3 w-28 h-28 mb-5 p-2 rounded-2xl bg-slate-900/60 border border-slate-700/50 shadow-inner">
                    <div class="bg-red-500 rounded-lg animate-pulse"></div>
                    <div class="bg-emerald-500 rounded-lg"></div>
                    <div class="bg-amber-500 rounded-lg"></div>
                    <div class="bg-blue-500 rounded-lg animate-pulse"></div>
                </div>

                <h2 class="text-xl font-bold mb-2 text-slate-100">اختبر قوة ذاكرتك!</h2>
                <p class="text-slate-400 text-xs sm:text-sm leading-relaxed mb-6 max-w-xs">
                    راقب تسلسل الألوان بدقة، تذكر الترتيب الصحيح، وأعد ضغطه بنفس الترتيب لتصل لأعلى درجات التحدي!
                </p>

                <!-- Action Buttons -->
                <button onclick="quickStartGame()" class="w-full py-3.5 px-6 mb-3 text-base font-extrabold text-white bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 active:scale-95 rounded-2xl shadow-lg shadow-emerald-900/30 transition-all duration-200 cursor-pointer">
                    ابدأ اللعب الآن
                </button>

                <button onclick="showScreen('levels-screen')" class="w-full py-3 px-6 text-sm font-bold text-slate-200 bg-slate-800/80 hover:bg-slate-700 active:scale-95 rounded-2xl border border-slate-700 transition-all duration-200 cursor-pointer">
                    اختيار المستوى
                </button>
            </div>
        </section>

        <!-- ================= 2. LEVELS SCREEN ================= -->
        <section id="levels-screen" class="screen w-full flex-col items-center">
            <div class="glass-panel w-full rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col items-center border border-slate-800">
                
                <h2 class="text-xl font-black mb-1 text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-amber-500">
                    اختر مستوى الصعوبة
                </h2>
                <p class="text-slate-400 text-xs mb-5 text-center">حدد المستوى المناسب لمهارتك في التذكر</p>

                <div class="w-full flex flex-col gap-3 mb-5">
                    <!-- Easy Level Button -->
                    <button onclick="selectLevel('easy')" class="w-full p-3.5 flex items-center justify-between rounded-2xl bg-slate-900/80 hover:bg-slate-800 border-2 border-emerald-500/50 hover:border-emerald-400 transition-all active:scale-95 cursor-pointer text-right group">
                        <div>
                            <div class="text-base font-bold text-emerald-400 mb-0.5">سهل (Easy)</div>
                            <div class="text-xs text-slate-400">سرعة بطيئة، مثالي للتدريب والبدايات</div>
                        </div>
                        <span class="text-xl group-hover:translate-x-[-4px] transition-transform">🟢</span>
                    </button>

                    <!-- Medium Level Button -->
                    <button onclick="selectLevel('medium')" class="w-full p-3.5 flex items-center justify-between rounded-2xl bg-slate-900/80 hover:bg-slate-800 border-2 border-amber-500/50 hover:border-amber-400 transition-all active:scale-95 cursor-pointer text-right group">
                        <div>
                            <div class="text-base font-bold text-amber-400 mb-0.5">متوسط (Medium)</div>
                            <div class="text-xs text-slate-400">سرعة معتدلة، وتحدي متوازن للملاحظة</div>
                        </div>
                        <span class="text-xl group-hover:translate-x-[-4px] transition-transform">🟡</span>
                    </button>

                    <!-- Hard Level Button -->
                    <button onclick="selectLevel('hard')" class="w-full p-3.5 flex items-center justify-between rounded-2xl bg-slate-900/80 hover:bg-slate-800 border-2 border-rose-500/50 hover:border-rose-400 transition-all active:scale-95 cursor-pointer text-right group">
                        <div>
                            <div class="text-base font-bold text-rose-400 mb-0.5">صعب (Hard)</div>
                            <div class="text-xs text-slate-400">سرعة فائقة وخاطفة، لأصحاب الذاكرة الحديدية!</div>
                        </div>
                        <span class="text-xl group-hover:translate-x-[-4px] transition-transform">🔴</span>
                    </button>
                </div>

                <!-- Back to Home -->
                <button onclick="showScreen('home-screen')" class="w-full py-2.5 text-xs font-bold text-slate-400 hover:text-slate-200 transition-colors cursor-pointer">
                    العودة للقائمة الرئيسية
                </button>
            </div>
        </section>

        <!-- ================= 3. GAME SCREEN ================= -->
        <section id="game-screen" class="screen w-full flex-col items-center">
            
            <!-- Top Score & Stats Bar -->
            <div class="glass-panel w-full rounded-2xl p-3 mb-3 shadow-xl flex justify-between items-center text-center">
                <div class="flex flex-col items-center w-1/3 border-l
